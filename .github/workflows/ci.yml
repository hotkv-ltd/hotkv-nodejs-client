name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (ESM + CJS + types)
        run: npm run build

      - name: Unit tests (no server required)
        run: npm run test:unit

      - name: Pack the npm tarball
        run: npm pack

  # Integration tests exercise a live HotKV server and are not run here: no
  # HotKV server is reachable from this repository's CI runners. To enable
  # this job, point HOTKV_TEST_URL at a reachable HotKV server (for example
  # one started by a service container, or a step that downloads and runs
  # the hotkv binary in the runner) and remove the `if: false` guard below.
  # Every test that needs a license feature the target server does not have
  # loaded skips itself with a clear reason instead of failing, so this job
  # works against a server with or without the license features.
  integration:
    name: Integration tests (needs a live HotKV server, disabled here)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration
        env:
          HOTKV_TEST_URL: hotkv://127.0.0.1:6379

  license-header-check:
    name: License header check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check every source and test file starts with the copyright header
        run: |
          missing=""
          for f in $(find src test -name "*.ts"); do
            if ! head -2 "$f" | grep -q "Copyright (c) 2026 HotKV Ltd"; then
              missing="$missing\n  $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Files missing the license header:$missing"
            exit 1
          fi
          echo "All source files have the license header."
